
name: Build Ustadh APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q ustadh_android_project.zip

      - name: Build APK
        working-directory: ustadh_android_project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ustadh-debug-apk
          path: ustadh_android_project/app/build/outputs/apk/debug/app-debug.apk
